<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04050a">
<title>critical line</title>
<meta name="description" content="ζ(½ + it) traced as t rises. It passes through the centre at each zero. Seal, Nov 2026.">
<style>
html,body{margin:0;height:100%;background:#04050a;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#cap{position:fixed;left:max(20px,env(safe-area-inset-left));bottom:max(20px,env(safe-area-inset-bottom));max-width:min(290px,68vw);font:11.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;color:rgba(214,206,190,.62);letter-spacing:.01em;pointer-events:none}
#cap b{display:block;font:italic 19px/1.2 Georgia,'Times New Roman',serif;color:rgba(244,234,214,.88);font-weight:normal;margin-bottom:7px}
#cap i{font-style:normal;color:rgba(214,206,190,.38)}
#tr{position:fixed;right:max(20px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));font:11.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;color:rgba(214,206,190,.55);pointer-events:none;text-align:right;font-variant-numeric:tabular-nums}
#zl{position:fixed;left:max(20px,env(safe-area-inset-left));top:max(24px,env(safe-area-inset-top));pointer-events:none;opacity:0;color:rgb(246,236,216)}
#zl .v{font:italic 26px/1.1 Georgia,'Times New Roman',serif;letter-spacing:.01em;font-variant-numeric:tabular-nums}
#zl .n{font:11.5px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:rgba(214,206,190,.6);margin-top:6px;letter-spacing:.04em}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="cap"><b>critical line</b>The point is ζ(½ + it) as t rises from 0. It passes through the small ring, 0, exactly when t is a zero of ζ.<br><br>Seal, Nov 2026<br><i>hold to slow · tap to hurry</i></div>
<div id="tr"></div>
<div id="zl"><div class="v"></div><div class="n"></div></div>
<script>
(() => {
'use strict';
const REC = /[?&]rec\b/.test(location.search), HURRY0 = /[?&]hurry\b/.test(location.search);

// ---------- the math: zeta on the critical line ----------
// Borwein's algorithm 2 for the alternating series eta(s) = sum (-1)^k (k+1)^-s,
// then zeta(s) = eta(s) / (1 - 2^(1-s)).  Error ~ e^(pi t/2) / (3+sqrt 8)^N,
// so N = 180 terms is good past 1e-12 for every t up to 150.
const N = 180;
const a = new Float64Array(N + 1);
a[0] = 1 / N;
for (let i = 1; i <= N; i++) a[i] = a[i - 1] * 4 * (N + i - 1) * (N - i + 1) / ((2 * i) * (2 * i - 1));
const tails = new Float64Array(N + 1);
let acc = 0;
for (let i = N; i >= 0; i--) { tails[i] = acc; acc += a[i]; }
const W = new Float64Array(N), LK = new Float64Array(N);
for (let k = 0; k < N; k++) {
  W[k] = ((k & 1) ? -1 : 1) * (tails[k] / acc) / Math.sqrt(k + 1); // (d_n - d_k)/d_n * (k+1)^-1/2
  LK[k] = Math.log(k + 1);
}
const SQ2 = Math.SQRT2, LN2 = Math.LN2;
const out = [0, 0];
function zeta(t) { // zeta(1/2 + i t) -> out = [re, im]
  let er = 0, ei = 0;
  for (let k = 0; k < N; k++) {
    const p = t * LK[k], w = W[k];
    er += w * Math.cos(p);
    ei -= w * Math.sin(p);
  }
  const dr = 1 - SQ2 * Math.cos(t * LN2), di = SQ2 * Math.sin(t * LN2);
  const m = dr * dr + di * di;
  out[0] = (er * dr + ei * di) / m;
  out[1] = (ei * dr - er * di) / m;
  return out;
}
window.__zeta = t => { const z = zeta(t); return [z[0], z[1]]; };

// ---------- samples, computed ahead of the playhead ----------
const T_MAX = 150, DT = 0.004, NS = Math.ceil(T_MAX / DT) + 4;
const X = new Float32Array(NS), Y = new Float32Array(NS), M = new Float32Array(NS);
let computed = 0, scanned = 1;
const zeros = [];
function compute(deadline) {
  while (computed < NS && performance.now() < deadline) {
    for (let j = 0; j < 40 && computed < NS; j++) {
      zeta(computed * DT);
      X[computed] = out[0]; Y[computed] = out[1]; M[computed] = Math.hypot(out[0], out[1]);
      computed++;
    }
  }
  // zeros: local minima of |zeta| between samples, refined until |zeta| < 1e-6
  while (scanned < computed - 1) {
    const i = scanned++;
    if (M[i] < 0.25 && M[i] <= M[i - 1] && M[i] <= M[i + 1]) {
      let lo = (i - 1) * DT, hi = (i + 1) * DT;
      for (let k = 0; k < 80; k++) {
        const m1 = lo + (hi - lo) / 3, m2 = hi - (hi - lo) / 3;
        zeta(m1); const f1 = out[0] * out[0] + out[1] * out[1];
        zeta(m2); const f2 = out[0] * out[0] + out[1] * out[1];
        if (f1 < f2) hi = m2; else lo = m1;
      }
      const tz = (lo + hi) / 2;
      zeta(tz);
      if (Math.hypot(out[0], out[1]) < 1e-6 && (!zeros.length || tz - zeros[zeros.length - 1] > 1e-3)) zeros.push(tz);
    }
  }
}
window.__zeros = zeros;

// ---------- canvas ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const tr = document.getElementById('tr'), zl = document.getElementById('zl'), zlv = zl.firstChild, zln = zl.lastChild;
let shownZero = 0;
let Wpx = 0, Hpx = 0, dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  Wpx = Math.round(innerWidth * dpr); Hpx = Math.round(innerHeight * dpr);
  cv.width = Wpx; cv.height = Hpx;
}
addEventListener('resize', resize);
resize();

// ---------- state ----------
const BASE = 2.5;          // t per second when nothing is happening
const CX = 0.6;            // the view centres on 0.6 + 0i: zeta circles around 1, so the origin sits off centre
let t, zi, pulses, EL, ES, phase, phaseAge, life;
let mult = HURRY0 ? 3 : 1, target = mult, hurry = HURRY0;
function reset() { t = 0; zi = 0; pulses = []; EL = 2.3; ES = 1.4; phase = 'run'; phaseAge = 0; life = 0; shownZero = 0; }
reset();

function idxAt(tt) { return Math.min(computed - 2, Math.max(0, Math.floor(tt / DT))); }
function lerpAt(arr, tt) { const i = idxAt(tt), f = tt / DT - i; return arr[i] + (arr[i + 1] - arr[i]) * f; }
const sm = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);

function step(dt) {
  dt = Math.min(dt, 0.1);
  life += dt;
  mult += (target - mult) * (1 - Math.exp(-dt * 5));
  if (phase === 'run') {
    const m = lerpAt(M, t);
    const v = BASE * mult * (0.18 + 0.82 * sm(m / 0.95)) * (0.35 + 0.65 * sm(life / 2.5));
    const tn = Math.min(t + v * dt, T_MAX, (computed - 4) * DT);
    while (zi < zeros.length && zeros[zi] <= tn) { pulses.push({ n: zi + 1, tz: zeros[zi], age: 0 }); zi++; }
    t = Math.max(t, tn);
    if (t >= T_MAX - 1e-9) { phase = 'end'; phaseAge = 0; }
  } else {
    phaseAge += dt;
    if (phaseAge > 7) reset();
  }
  for (const p of pulses) p.age += dt;
  while (pulses.length > 1 && pulses[0].age > 6) pulses.shift();
  // camera: fit the last ~12 units of t (plus a little ahead), each axis on its own, eased slowly
  const i = idxAt(t), i0 = Math.max(0, i - 3000), i1 = Math.min(computed - 1, i + 300);
  let mr = 0, mi = 0;
  for (let k = i0; k <= i1; k += 3) { const dx = Math.abs(X[k] - CX), dy = Math.abs(Y[k]); if (dx > mr) mr = dx; if (dy > mi) mi = dy; }
  const ELt = Math.max(2.3, 1.08 * mr), ESt = Math.max(1.4, 1.08 * mi);
  EL += (ELt - EL) * (1 - Math.exp(-dt * (ELt > EL ? 0.9 : 0.3)));
  ES += (ESt - ES) * (1 - Math.exp(-dt * (ESt > ES ? 0.9 : 0.3)));
}

function mix(c1, c2, f) { return [c1[0] + (c2[0] - c1[0]) * f, c1[1] + (c2[1] - c1[1]) * f, c1[2] + (c2[2] - c1[2]) * f]; }
const C_OLD = [52, 70, 150], C_MID = [128, 156, 226], C_NEW = [255, 228, 178];
function trailColor(f) { return f < 0.6 ? mix(C_OLD, C_MID, f / 0.6) : mix(C_MID, C_NEW, (f - 0.6) / 0.4); }

function draw() {
  const W_ = Wpx, H_ = Hpx;
  // portrait: the real axis points down the screen and the imaginary axis across; landscape: the usual way
  const port = H_ > W_, Lh = (port ? H_ : W_) * 0.5, Sh = (port ? W_ : H_) * 0.5;
  const s = Math.min(Lh * 0.80 / EL, Sh * 0.86 / ES);
  const cxs = W_ * 0.5, cys = H_ * (port ? 0.45 : 0.5);          // screen point where CX + 0i sits
  const ox = port ? cxs : cxs - CX * s, oy = port ? cys - CX * s : cys; // the origin on screen
  const P = port ? ((re, im) => [ox - im * s, oy + re * s]) : ((re, im) => [ox + re * s, oy - im * s]);
  const px = port ? (k => ox - Y[k] * s) : (k => ox + X[k] * s);
  const py = port ? (k => oy + X[k] * s) : (k => oy - Y[k] * s);
  let fade = sm(life / 2);
  if (phase === 'end') fade *= 1 - sm(phaseAge / 4.5);

  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#04050a';
  ctx.fillRect(0, 0, W_, H_);
  const vg = ctx.createRadialGradient(cxs, cys, 0, cxs, cys, Math.max(W_, H_) * 0.75);
  vg.addColorStop(0, 'rgba(22,26,44,0.55)'); vg.addColorStop(1, 'rgba(4,5,10,0)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W_, H_);

  const hi = idxAt(t), hf = t / DT - hi;
  const [hx, hy] = P(X[hi] + (X[hi + 1] - X[hi]) * hf, Y[hi] + (Y[hi + 1] - Y[hi]) * hf);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.globalCompositeOperation = 'lighter';

  // the whole past, faint
  if (hi > 2) {
    const st = Math.max(1, Math.ceil(hi / 6000));
    ctx.beginPath(); ctx.moveTo(px(0), py(0));
    for (let k = st; k < hi; k += st) ctx.lineTo(px(k), py(k));
    ctx.lineTo(hx, hy);
    const reveal = phase === 'end' ? sm(phaseAge / 1.6) * (1 - sm((phaseAge - 4.2) / 2.4)) : 0;
    ctx.globalAlpha = (0.075 + 0.26 * reveal) * (phase === 'end' ? 1 : fade); ctx.strokeStyle = 'rgb(120,140,205)'; ctx.lineWidth = 0.8 * dpr; ctx.stroke();
  }

  // the recent trail, in bands that fade with age, with a soft glow near the head
  const L = 3400, B = 40, start = Math.max(0, hi - L);
  for (let b = 0; b < B; b++) {
    const k0 = start + Math.floor((hi - start) * b / B), k1 = start + Math.floor((hi - start) * (b + 1) / B);
    if (k1 <= k0) continue;
    const age = 1 - (hi - (k0 + k1) / 2) / L; // 1 = newest
    const c = trailColor(age);
    ctx.beginPath(); ctx.moveTo(px(k0), py(k0));
    for (let k = k0 + 1; k <= k1; k++) ctx.lineTo(px(k), py(k));
    if (b === B - 1) ctx.lineTo(hx, hy);
    ctx.strokeStyle = `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
    ctx.globalAlpha = (0.10 + 0.90 * Math.pow(age, 1.5)) * fade;
    ctx.lineWidth = (0.8 + 1.2 * age * age) * dpr; ctx.stroke();
    if (age > 0.55) { ctx.globalAlpha = Math.pow((age - 0.55) / 0.45, 2) * 0.16 * fade; ctx.lineWidth = (4 + 6 * age) * dpr; ctx.stroke(); }
  }

  // the origin: a small fixed ring, always there. at a zero it fills with light and blooms.
  let flare = 0;
  for (const p of pulses) flare = Math.max(flare, p.age < 0.12 ? p.age / 0.12 : Math.exp(-(p.age - 0.12) * 1.25));
  if (flare > 0.003) {
    const rb = (26 + 30 * flare) * dpr;
    const g = ctx.createRadialGradient(ox, oy, 0, ox, oy, rb);
    g.addColorStop(0, `rgba(255,244,222,${0.75 * flare * fade})`);
    g.addColorStop(0.18, `rgba(255,226,176,${0.28 * flare * fade})`);
    g.addColorStop(1, 'rgba(255,226,176,0)');
    ctx.globalAlpha = 1; ctx.fillStyle = g; ctx.fillRect(ox - rb, oy - rb, 2 * rb, 2 * rb);
  }
  ctx.globalAlpha = (0.55 + 0.45 * flare) * fade; ctx.strokeStyle = 'rgb(236,228,212)'; ctx.lineWidth = 1 * dpr;
  ctx.beginPath(); ctx.arc(ox, oy, 4.2 * dpr, 0, 6.2832); ctx.stroke();
  if (flare > 0.003) { ctx.globalAlpha = flare * fade; ctx.fillStyle = 'rgb(255,248,232)'; ctx.beginPath(); ctx.arc(ox, oy, 3.2 * dpr, 0, 6.2832); ctx.fill(); }

  // head
  ctx.globalAlpha = fade;
  const hg = ctx.createRadialGradient(hx, hy, 0, hx, hy, 11 * dpr);
  hg.addColorStop(0, 'rgba(255,246,226,0.95)'); hg.addColorStop(0.25, 'rgba(255,226,170,0.35)'); hg.addColorStop(1, 'rgba(255,226,170,0)');
  ctx.fillStyle = hg; ctx.fillRect(hx - 11 * dpr, hy - 11 * dpr, 22 * dpr, 22 * dpr);

  // the ledger: a thin t-ruler down the right edge, 0 at top and T_MAX at the bottom, one tick per zero passed
  {
    const rx = W_ - Math.max(20, 14) * dpr, r0 = Math.max(24, 30) * dpr, r1 = H_ - 92 * dpr;
    ctx.globalAlpha = 0.10 * fade; ctx.fillStyle = 'rgb(200,196,186)';
    ctx.fillRect(rx - 0.5 * dpr, r0, 1 * dpr, r1 - r0);
    for (let n = 0; n < zi; n++) {
      const y = r0 + (r1 - r0) * zeros[n] / T_MAX;
      const lpn = pulses.find(p => p.n === n + 1);
      const g = lpn ? Math.exp(-lpn.age * 0.8) : 0;
      ctx.globalAlpha = (0.32 + 0.68 * g) * fade;
      ctx.fillStyle = g > 0.02 ? 'rgb(255,236,200)' : 'rgb(170,180,214)';
      const w = (5 + 7 * g) * dpr;
      ctx.fillRect(rx - w, y - 0.5 * dpr, w, 1 * dpr);
    }
    const yh = r0 + (r1 - r0) * t / T_MAX;
    ctx.globalAlpha = 0.7 * fade; ctx.fillStyle = 'rgb(255,240,214)';
    ctx.beginPath(); ctx.arc(rx, yh, 1.8 * dpr, 0, 6.2832); ctx.fill();
  }

  // the zero's t, said quietly in a fixed corner (newest only)
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  const lp = pulses[pulses.length - 1];
  let za = 0;
  if (lp) za = sm(lp.age / 0.6) * (1 - sm((lp.age - 3.4) / 1.6)) * fade;
  if (lp && lp.n !== shownZero) { shownZero = lp.n; zlv.textContent = 't = ' + lp.tz.toFixed(6); zln.textContent = 'zero ' + lp.n; }
  zl.style.opacity = za.toFixed(3);
  tr.textContent = 't ' + t.toFixed(2);
}

// ---------- touch: hold to slow, tap to hurry ----------
let holdTimer = 0, holding = false;
function release(toggle) {
  clearTimeout(holdTimer);
  if (holding) holding = false;
  else if (toggle) hurry = !hurry;
  target = hurry ? 3 : 1;
}
addEventListener('pointerdown', () => { holdTimer = setTimeout(() => { holding = true; target = 0.2; }, 230); });
addEventListener('pointerup', () => release(true));
addEventListener('pointercancel', () => release(false));
addEventListener('contextmenu', e => e.preventDefault());

// ---------- run ----------
if (REC) {
  compute(Infinity);
  window.__frame = dt => { step(dt); draw(); };
  window.__state = () => ({ t, zeros: zeros.length, EL, ES, phase });
  window.__ready = true;
} else {
  compute(performance.now() + 40);
  let last = performance.now();
  const loop = now => {
    compute(now + 5);
    step((now - last) / 1000); last = now;
    draw();
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
